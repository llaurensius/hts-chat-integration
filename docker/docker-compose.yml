services:
  postgres:
    image: postgres:15-alpine
    container_name: hts_postgres
    restart: always
    environment:
      POSTGRES_USER: helpdesk_user
      POSTGRES_PASSWORD: SecretPassword123!
      POSTGRES_DB: wa_helpdesk
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - hts-net

  redis:
    image: redis:alpine
    container_name: hts_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - hts-net

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: hts_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=SecureTokenUntukBackend123
      - AUTH_TOKEN=SecureTokenUntukBackend123
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://helpdesk_user:SecretPassword123!@postgres:5432/evolution_db?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
    depends_on:
      - postgres
      - redis
    networks:
      - hts-net

volumes:
  pgdata:
  redisdata:

networks:
  hts-net:
    driver: bridge
